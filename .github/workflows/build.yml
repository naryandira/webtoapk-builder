name: Build WebView APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL website"
        required: true
        type: string
      appName:
        description: "Nama aplikasi"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ inputs.appName }}
      WEB_URL: ${{ inputs.url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate inputs
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlparse

          url = os.environ["WEB_URL"].strip()
          name = os.environ["APP_NAME"].strip()

          parsed = urlparse(url)

          if parsed.scheme not in ("http", "https") or not parsed.netloc:
              raise SystemExit("URL tidak valid. Gunakan https:// atau http://")

          if not name:
              raise SystemExit("Nama aplikasi tidak boleh kosong.")

          if len(name) > 50:
              raise SystemExit("Nama aplikasi maksimal 50 karakter.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("VALIDATED_WEB_URL=" + url + "\n")
              f.write("VALIDATED_APP_NAME=" + name + "\n")

          print("URL valid.")
          print("Nama aplikasi valid.")
          PY

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/webtoapk/app

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "WebToApk"
          include(":app")
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.webtoapk.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.webtoapk.app'
                  minSdk 23
                  targetSdk 32
                  versionCode 1
                  versionName '1.0'
              }

              buildFeatures {
                  buildConfig true
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }

                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:label="WebToApk"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/webtoapk/app/MainActivity.kt <<'EOF'
          package com.webtoapk.app

          import android.annotation.SuppressLint
          import android.app.Activity
          import android.os.Bundle
          import android.view.View
          import android.view.ViewGroup
          import android.webkit.WebChromeClient
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.FrameLayout
          import android.widget.ProgressBar
          import android.widget.TextView
          import android.graphics.Color

          class MainActivity : Activity() {

              private lateinit var webView: WebView
              private lateinit var progressBar: ProgressBar
              private lateinit var errorView: TextView

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.WHITE)

                  webView = WebView(this)
                  webView.layoutParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      ViewGroup.LayoutParams.MATCH_PARENT
                  )

                  progressBar = ProgressBar(
                      this,
                      null,
                      android.R.attr.progressBarStyleHorizontal
                  )
                  progressBar.isIndeterminate = true

                  val progressParams = FrameLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT,
                      8
                  )
                  progressParams.gravity = android.view.Gravity.TOP

                  errorView = TextView(this)
                  errorView.text = "Website gagal dimuat. Periksa koneksi internet lalu coba lagi."
                  errorView.textSize = 16f
                  errorView.setTextColor(Color.DKGRAY)
                  errorView.gravity = android.view.Gravity.CENTER
                  errorView.setPadding(32, 32, 32, 32)
                  errorView.visibility = View.GONE

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      loadsImagesAutomatically = true
                      mixedContentMode = WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE
                      javaScriptCanOpenWindowsAutomatically = false
                      setSupportMultipleWindows(false)
                  }

                  webView.webChromeClient = object : WebChromeClient() {
                      override fun onProgressChanged(view: WebView?, newProgress: Int) {
                          progressBar.visibility =
                              if (newProgress < 100) View.VISIBLE else View.GONE
                      }
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageStarted(
                          view: WebView?,
                          url: String?,
                          favicon: android.graphics.Bitmap?
                      ) {
                          errorView.visibility = View.GONE
                          progressBar.visibility = View.VISIBLE
                      }

                      override fun onPageFinished(view: WebView?, url: String?) {
                          progressBar.visibility = View.GONE
                      }

                      override fun onReceivedError(
                          view: WebView?,
                          request: WebResourceRequest?,
                          error: WebResourceError?
                      ) {
                          super.onReceivedError(view, request, error)

                          if (request?.isForMainFrame == true) {
                              progressBar.visibility = View.GONE
                              errorView.visibility = View.VISIBLE
                          }
                      }
                  }

                  root.addView(webView)
                  root.addView(progressBar, progressParams)
                  root.addView(errorView)

                  setContentView(root)

                  if (savedInstanceState != null) {
                      webView.restoreState(savedInstanceState)
                  } else {
                      webView.loadUrl(BuildConfig.WEB_URL)
                  }
              }

              override fun onSaveInstanceState(outState: Bundle) {
                  webView.saveState(outState)
                  super.onSaveInstanceState(outState)
              }

              @Suppress("DEPRECATION")
              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }

              override fun onDestroy() {
                  if (::webView.isInitialized) {
                      webView.stopLoading()
                      webView.destroy()
                  }
                  super.onDestroy()
              }
          }
          EOF

      - name: Configure app URL and name
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import json
          import re
          import xml.sax.saxutils

          url = os.environ["VALIDATED_WEB_URL"]
          app_name = os.environ["VALIDATED_APP_NAME"]

          # Escape the URL as a valid Java/Kotlin string literal.
          url_literal = json.dumps(url, ensure_ascii=True)

          gradle_path = Path("app/build.gradle")
          gradle_text = gradle_path.read_text(encoding="utf-8")

          marker = "versionName '1.0'"
          if marker not in gradle_text:
              raise SystemExit("Tidak menemukan versionName di app/build.gradle")

          gradle_text = gradle_text.replace(
              marker,
              marker + "\n                  buildConfigField 'String', 'WEB_URL', "
              + "'" + url_literal.replace("\\", "\\\\").replace("'", "\\'") + "'",
              1
          )

          gradle_path.write_text(gradle_text, encoding="utf-8")

          manifest_path = Path("app/src/main/AndroidManifest.xml")
          manifest_text = manifest_path.read_text(encoding="utf-8")

          safe_name = xml.sax.saxutils.escape(app_name, {'"': '&quot;'})
          manifest_text = manifest_text.replace(
              'android:label="WebToApk"',
              'android:label="' + safe_name + '"'
          )

          manifest_path.write_text(manifest_text, encoding="utf-8")

          print("Konfigurasi URL dan nama aplikasi selesai.")
          PY

      - name: Build APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebView-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error