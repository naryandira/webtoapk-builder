name: Build APK

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL Website'
        required: true
      appName:
        description: 'Nama APK'
        required: true
        default: 'MyApp'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build WebView APK
        run: |
          APP_NAME="${{ github.event.inputs.appName }}"
          URL="${{ github.event.inputs.url }}"
          echo "Building $APP_NAME for $URL"
          
          # Bikin project android simpel
          mkdir -p app/src/main/java/com/webtoapk/app
          mkdir -p app/src/main/res/layout
          
          cat > app/src/main/java/com/webtoapk/app/MainActivity.java <<EOF
          package com.webtoapk.app;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("$URL");
                  setContentView(webView);
              }
          }
          EOF
          
          echo "APK Build simulation for $APP_NAME - $URL" > ${APP_NAME}.apk
          echo "Ini nanti diganti build gradle beneran, tapi buat test trigger dulu"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.appName }}-APK
          path: "*.apk"
